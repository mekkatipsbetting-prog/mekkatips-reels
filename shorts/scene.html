<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0d1117;font-family:Inter,'Noto Color Emoji',sans-serif;color:#fff}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(255,122,26,.35),transparent 60%),linear-gradient(165deg,#1d2530,#0d1117 60%)}
#brand{position:absolute;top:90px;left:0;right:0;text-align:center;font-size:34px;font-weight:700;letter-spacing:4px;color:#ff9a4d}
#bar{position:absolute;top:0;left:0;height:10px;width:0;background:#ff7a1a}
.sc{position:absolute;left:80px;right:80px;top:240px;bottom:560px;display:flex;flex-direction:column;justify-content:center;opacity:0}
.t1{font-size:100px;font-weight:800;line-height:1.05}
.sub{font-size:48px;color:#c9d4df;margin-top:36px;line-height:1.25}
.h{font-size:72px;font-weight:800;margin-bottom:44px}
.step{display:flex;align-items:center;background:#1c2530;border:3px solid #2c3845;border-radius:28px;padding:30px 34px;font-size:42px;font-weight:600}
.num{flex:0 0 76px;height:76px;border-radius:50%;background:#ff7a1a;color:#111;font-weight:800;display:flex;align-items:center;justify-content:center;margin-right:30px;font-size:40px}
.link{width:6px;height:40px;background:#ff7a1a;margin-left:69px}
.big{font-size:210px;font-weight:900;color:#ff7a1a;line-height:1}
#cap{position:absolute;left:70px;right:70px;bottom:260px;text-align:center;font-size:58px;font-weight:800;line-height:1.3}
#cap span{background:rgba(0,0,0,.6);padding:6px 18px;border-radius:14px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
</style></head><body><div id="bg"></div><div id="bar"></div><div id="brand"></div><div id="root"></div><div id="cap"><span></span></div>
<script>
const D=window.DATA,durs=D.durs;const root=document.getElementById('root');
document.getElementById('brand').textContent=D.brand||'';
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
const scenes=D.scenes.map(s=>{const w=el('div','sc');const parts=[];
  if(s.kind==='steps'){w.appendChild(el('div','h',s.title||''));(s.steps||[]).forEach((st,i)=>{if(i){const l=el('div','link');w.appendChild(l);parts.push(l)}const r=el('div','step');r.appendChild(el('div','num',String(i+1)));r.appendChild(el('div','',st));w.appendChild(r);parts.push(r)});}
  else if(s.kind==='big'){w.appendChild(el('div','big',s.title||''));if(s.sub)w.appendChild(el('div','sub',s.sub));}
  else{w.appendChild(el('div','t1',s.title||''));if(s.sub)w.appendChild(el('div','sub',s.sub));}
  root.appendChild(w);
  const words=String(s.say||'').split(/\s+/).filter(Boolean);const chunks=[];for(let i=0;i<words.length;i+=5)chunks.push(words.slice(i,i+5).join(' '));
  return {w,parts,chunks};});
const starts=[];let acc=0;durs.forEach(d=>{starts.push(acc);acc+=d});window.DURATION=acc;
const cap=document.querySelector('#cap span');const bar=document.getElementById('bar');
const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
window.render=t=>{bar.style.width=(t/acc*100)+'%';
  let k=0;for(let i=0;i<starts.length;i++)if(t>=starts[i])k=i;
  scenes.forEach((o,i)=>{if(i!==k)o.w.style.opacity=0});
  const o=scenes[k],lt=t-starts[k],d=durs[k];
  const a=ease(lt/0.45);o.w.style.opacity=a;o.w.style.transform=`translateY(${(1-a)*60}px) scale(${0.96+0.04*a})`;
  if(o.parts.length){const span=(d*0.7)/o.parts.length;o.parts.forEach((p,j)=>{const e=ease((lt-0.3-j*span)/0.35);p.style.opacity=e;p.style.transform=`translateX(${(1-e)*-80}px)`;});}
  const len=Math.max(d-0.45,0.1);const ci=o.chunks.length?Math.min(o.chunks.length-1,Math.floor(lt/len*o.chunks.length)):-1;
  cap.textContent=ci>=0?o.chunks[ci]:'';cap.style.display=ci>=0?'inline':'none';
};
</script></body></html>
