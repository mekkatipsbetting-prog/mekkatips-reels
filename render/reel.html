<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
:root{--bg0:#14342a;--bg1:#0b1410;--ac:#3ddc97;--ac2:#9fe8c6;--card:#12231c;--bd:#24493a;--mu:#9fb8ad;--tx:#fff;--ft:#6f877c;--btn:#06150e;--r:36px}
body{width:1080px;height:1920px;background:var(--bg1);font-family:Inter,"Noto Color Emoji",sans-serif;color:var(--tx);overflow:hidden;position:relative}
.bg{position:absolute;inset:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55}
.brand{position:absolute;top:90px;left:0;right:0;text-align:center;font-weight:800;letter-spacing:6px;font-size:40px;color:var(--ac)}
.hook{position:absolute;top:620px;left:60px;right:60px;text-align:center}
.hook .big{font-size:150px;font-weight:900;line-height:1}
.hook .sub{font-size:56px;font-weight:600;color:var(--ac2);margin-top:24px}
.card{position:absolute;left:70px;right:70px;height:220px;background:var(--card);border:2px solid var(--bd);border-radius:var(--r);padding:32px 48px}
.card .tag{font-size:30px;font-weight:700;color:var(--ac);letter-spacing:2px}
.card .pick{font-size:50px;font-weight:800;margin-top:10px;line-height:1.15;max-width:700px}
.card .meta{font-size:36px;color:var(--mu);margin-top:8px}
.card .ok{position:absolute;right:48px;top:24px;font-size:54px}
.card .u{position:absolute;right:48px;bottom:30px;font-size:50px;font-weight:900;color:var(--ac)}
.total{position:absolute;left:0;right:0;text-align:center}
.total .n{font-size:200px;font-weight:900;color:var(--ac);line-height:1}
.total .l{font-size:46px;color:var(--mu);margin-top:8px}
.cta{position:absolute;left:60px;right:60px;text-align:center}
.cta .a{font-size:52px;font-weight:800}
.cta .url{display:inline-block;margin-top:24px;background:var(--ac);color:var(--btn);font-size:58px;font-weight:900;padding:26px 52px;border-radius:70px}
.cta .b{font-size:40px;color:var(--ac2);margin-top:26px}
.foot{position:absolute;bottom:60px;left:0;right:0;text-align:center;font-size:27px;color:var(--ft)}
</style></head><body>
<div class="bg" id="bg"></div><div class="brand">MEKKATIPS</div>
<div class="hook" id="hook"></div><div id="cards"></div><div class="total" id="total"></div><div class="cta" id="cta"></div>
<div class="foot">21+ · Bet responsibly · Past results don’t guarantee future results</div>
<script>
const D=window.DATA,$=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const E=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
const B=x=>{x=Math.min(1,Math.max(0,x));const c=1.70158,d=c+1;return 1+d*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
// Temas: [bg0,bg1,acento,acento2,card,borde,muted,texto,footer,texto boton]
const TH={
 verde:['#14342a','#0b1410','#3ddc97','#9fe8c6','#12231c','#24493a','#9fb8ad','#ffffff','#6f877c','#06150e'],
 neon:['#2a1052','#0a0618','#00e5ff','#ff4fd8','#150b2e','#3c2275','#b9a8e6','#ffffff','#7d6fa8','#05121a'],
 oro:['#3a2c0a','#0e0b04','#ffc83d','#ffe08a','#1f1807','#5a4513','#cbb98a','#ffffff','#8a7a4e','#1a1200'],
 fuego:['#4a1608','#120604','#ff6a2b','#ffb27a','#241009','#6a2a14','#d1a591','#ffffff','#8f6a5a','#1a0700'],
 hielo:['#0e2f4a','#050f1a','#5cc8ff','#b6e6ff','#0b1e30','#1f4b70','#a0bfd6','#ffffff','#6b8aa3','#04121d'],
 claro:['#ffffff','#e9efec','#0f9d63','#0b6b45','#ffffff','#cfe0d7','#5b6f66','#0b1410','#6b7d74','#ffffff']
};
const S=Object.assign({theme:'verde',bg:'radial',hook:'rise',cards:'left',radius:36,pace:1},D.style||{});
const t=TH[S.theme]||TH.verde,R=document.documentElement.style;
['--bg0','--bg1','--ac','--ac2','--card','--bd','--mu','--tx','--ft','--btn'].forEach((k,i)=>R.setProperty(k,t[i]));
R.setProperty('--r',(Number(S.radius)||36)+'px');
const bg=$('bg'),bgs={
 radial:`radial-gradient(900px 700px at 50% 20%,${t[0]} 0%,${t[1]} 70%)`,
 diag:`linear-gradient(160deg,${t[0]} 0%,${t[1]} 65%)`,
 grid:`linear-gradient(${t[2]}22 1px,transparent 1px),linear-gradient(90deg,${t[2]}22 1px,transparent 1px),radial-gradient(900px 700px at 50% 20%,${t[0]} 0%,${t[1]} 75%)`,
 rays:`repeating-conic-gradient(from 0deg at 50% 38%,${t[0]} 0deg 10deg,${t[1]} 10deg 20deg)`,
 orbs:`linear-gradient(180deg,${t[1]},${t[1]})`
};
bg.style.background=bgs[S.bg]||bgs.radial;
if(S.bg==='grid')bg.style.backgroundSize='70px 70px,70px 70px,100% 100%';
let orbs=[];
if(S.bg==='orbs'){[[t[2],520],[t[3],420],[t[0],620]].forEach(([c,sz])=>{const o=document.createElement('div');o.className='orb';o.style.cssText=`width:${sz}px;height:${sz}px;background:${c}`;bg.appendChild(o);orbs.push(o);});}
if(S.bg==='rays'){const v=document.createElement('div');v.style.cssText=`position:absolute;inset:0;background:radial-gradient(800px 800px at 50% 38%,transparent 0%,${t[1]} 85%)`;bg.appendChild(v);}
const P=D.picks.slice(0,3),N=P.length,tot=P.reduce((s,p)=>s+Number(p.units),0);
$('hook').innerHTML=`<div class="big">${esc(D.hook_big)}</div><div class="sub">${esc(D.hook_sub)}</div>`;
P.forEach((p,i)=>{const c=document.createElement('div');c.className='card';c.id='c'+i;c.style.top=(330+i*230)+'px';
 c.innerHTML=`<div class="tag">${esc(p.tag||'')}</div><div class="pick">${esc(p.pick)}</div><div class="meta">Odds ${esc(p.odds)}</div><div class="ok">✅</div><div class="u">+${Number(p.units).toFixed(2)}u</div>`;$('cards').appendChild(c);});
const totTop=330+N*230+30,ctaTop=totTop+320;
$('total').style.top=totTop+'px';$('total').innerHTML=`<div class="n" id="n">+0.00u</div><div class="l">${esc(D.total_label||'')}</div>`;
$('cta').style.top=ctaTop+'px';$('cta').innerHTML=`<div class="a">Picks completos y récord en la web</div><div class="url">mekkatipsbetting.com</div><div class="b">Link en la descripción</div>`;
const pc=Math.min(1.4,Math.max(0.7,Number(S.pace)||1));
const START=2.4,STEP=1.0*pc,tTot=START+N*STEP+0.6,tCta=tTot+2.2;window.DURATION=tCta+3.2;
function render(t){
 const hIn=E(t/0.6),hOut=E((t-1.9)/0.4),h=$('hook');
 let tf;
 if(S.hook==='zoom'){const k=0.6+0.4*E(t/0.7);tf=`scale(${k*(1+0.25*hOut)})`;}
 else if(S.hook==='slam'){const b=B(t/0.5);const sh=t<0.7&&t>0.45?Math.sin(t*90)*8*(0.7-t)/0.25:0;tf=`scale(${2.4-1.4*b}) translateX(${sh}px)`;}
 else tf=`translateY(${(1-hIn)*60-hOut*60}px) scale(${0.9+0.1*hIn})`;
 h.style.opacity=(S.hook==='slam'?Math.min(1,t/0.15):hIn)*(1-hOut);h.style.transform=tf;
 P.forEach((p,i)=>{const s=START+i*STEP,c=$('c'+i),e=E((t-s)/0.5),b=B((t-s)/0.55);let tf;
  const m=S.cards==='alt'?(i%2?'right':'left'):S.cards;
  if(m==='right')tf=`translateX(${(1-e)*200}px)`;
  else if(m==='pop')tf=`scale(${0.5+0.5*b})`;
  else if(m==='drop')tf=`translateY(${(1-b)*-260}px)`;
  else tf=`translateX(${(1-e)*-200}px)`;
  c.style.opacity=e;c.style.transform=tf;
  const q=E((t-s-0.45)/0.3),ok=c.querySelector('.ok');ok.style.opacity=q;ok.style.transform=`scale(${0.4+0.6*q})`;c.querySelector('.u').style.opacity=q;});
 $('total').style.opacity=E((t-tTot)/0.5);$('n').textContent='+'+(tot*E((t-tTot-0.1)/1.8)).toFixed(2)+'u';
 const cp=E((t-tCta)/0.6);$('cta').style.opacity=cp;$('cta').style.transform=`translateY(${(1-cp)*40}px)`;
 orbs.forEach((o,i)=>{const a=t*0.5+i*2.1;o.style.left=(300+Math.cos(a)*320-260+i*40)+'px';o.style.top=(700+Math.sin(a*0.8+i)*520-260+i*200)+'px';});
}
window.render=render;render(0);
</script></body></html>
