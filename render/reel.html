<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0b1410;font-family:Inter,"Noto Color Emoji",sans-serif;color:#fff;overflow:hidden;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(900px 700px at 50% 20%,#14342a 0%,#0b1410 70%)}
.brand{position:absolute;top:90px;left:0;right:0;text-align:center;font-weight:800;letter-spacing:6px;font-size:40px;color:#3ddc97}
.hook{position:absolute;top:620px;left:60px;right:60px;text-align:center}
.hook .big{font-size:150px;font-weight:900;line-height:1}
.hook .sub{font-size:56px;font-weight:600;color:#9fe8c6;margin-top:24px}
.card{position:absolute;left:70px;right:70px;height:220px;background:#12231c;border:2px solid #24493a;border-radius:36px;padding:32px 48px}
.card .tag{font-size:30px;font-weight:700;color:#3ddc97;letter-spacing:2px}
.card .pick{font-size:50px;font-weight:800;margin-top:10px;line-height:1.15;max-width:700px}
.card .meta{font-size:36px;color:#9fb8ad;margin-top:8px}
.card .ok{position:absolute;right:48px;top:24px;font-size:54px}
.card .u{position:absolute;right:48px;bottom:30px;font-size:50px;font-weight:900;color:#3ddc97}
.total{position:absolute;left:0;right:0;text-align:center}
.total .n{font-size:200px;font-weight:900;color:#3ddc97;line-height:1}
.total .l{font-size:46px;color:#9fb8ad;margin-top:8px}
.cta{position:absolute;left:60px;right:60px;text-align:center}
.cta .a{font-size:52px;font-weight:800}
.cta .url{display:inline-block;margin-top:24px;background:#3ddc97;color:#06150e;font-size:58px;font-weight:900;padding:26px 52px;border-radius:70px}
.cta .b{font-size:40px;color:#9fe8c6;margin-top:26px}
.foot{position:absolute;bottom:60px;left:0;right:0;text-align:center;font-size:27px;color:#6f877c}
</style></head><body>
<div class="bg"></div><div class="brand">MEKKATIPS</div>
<div class="hook" id="hook"></div><div id="cards"></div><div class="total" id="total"></div><div class="cta" id="cta"></div>
<div class="foot">21+ · Bet responsibly · Past results don’t guarantee future results</div>
<script>
const D=window.DATA,$=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const E=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
const P=D.picks.slice(0,3),N=P.length,tot=P.reduce((s,p)=>s+Number(p.units),0);
$('hook').innerHTML=`<div class="big">${esc(D.hook_big)}</div><div class="sub">${esc(D.hook_sub)}</div>`;
P.forEach((p,i)=>{const c=document.createElement('div');c.className='card';c.id='c'+i;c.style.top=(330+i*230)+'px';
 c.innerHTML=`<div class="tag">${esc(p.tag||'')}</div><div class="pick">${esc(p.pick)}</div><div class="meta">Odds ${esc(p.odds)}</div><div class="ok">✅</div><div class="u">+${Number(p.units).toFixed(2)}u</div>`;$('cards').appendChild(c);});
const totTop=330+N*230+30,ctaTop=totTop+320;
$('total').style.top=totTop+'px';$('total').innerHTML=`<div class="n" id="n">+0.00u</div><div class="l">${esc(D.total_label||'')}</div>`;
$('cta').style.top=ctaTop+'px';$('cta').innerHTML=`<div class="a">Picks completos y récord en la web</div><div class="url">mekkatipsbetting.com</div><div class="b">Plus: link en comentarios</div>`;
const START=2.4,STEP=1.0,tTot=START+N*STEP+0.6,tCta=tTot+2.2;window.DURATION=tCta+3.2;
function render(t){
 const hIn=E(t/0.6),hOut=E((t-1.9)/0.4),h=$('hook');h.style.opacity=hIn*(1-hOut);h.style.transform=`translateY(${(1-hIn)*60-hOut*60}px) scale(${0.9+0.1*hIn})`;
 P.forEach((p,i)=>{const s=START+i*STEP,c=$('c'+i),pr=E((t-s)/0.5);c.style.opacity=pr;c.style.transform=`translateX(${(1-pr)*-200}px)`;
  const q=E((t-s-0.45)/0.3),ok=c.querySelector('.ok');ok.style.opacity=q;ok.style.transform=`scale(${0.4+0.6*q})`;c.querySelector('.u').style.opacity=q;});
 $('total').style.opacity=E((t-tTot)/0.5);$('n').textContent='+'+(tot*E((t-tTot-0.1)/1.8)).toFixed(2)+'u';
 const cp=E((t-tCta)/0.6);$('cta').style.opacity=cp;$('cta').style.transform=`translateY(${(1-cp)*40}px)`;
}
window.render=render;render(0);
</script></body></html>
