<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}

<script>
window.DURATION=27;

const DEF={lang:'es',sportLabel:'NBA',scope:'LA NBA',date:'LUN 9 NOV',

 sub:'desde el 1 de noviembre'};

const es=D.lang!=='en';
const rec=D.rec,uSign=v=>(v>=0?'+':'')+v.toFixed(2)+'u';
D.units2=uSign(rec.u);
const T=es?{hook:'EN LA 1ª MITAD DE '+D.scope,how:'¿CÓMO? MIRA EL MODELO ▸',how2:'CÓMO FUNCIONA',m0:'Modelo entrenado con miles de partidos',m1:'Compara',m1v:'Modelo vs Mercado',m2:'Solo juega si hay',m2v:'+EDGE',m3:'Especialidad',m3v:'1ª MITAD',away:'VISITA',home:'LOCAL',rec:'RÉCORD',pick:'EL PICK',mod:'MODELO',mkt:'MERCADO',hit:'CUMPLIÓ',res1:'RESULTADO · 1ª MITAD',res2:'RESULTADO · FINAL',recp:'RÉCORD · ',chart:'UNIDADES ACUMULADAS',foot:'21+ · Juega con responsabilidad',
  caps:['Así va el modelo en la <b>1ª mitad</b>','Compara el <b>modelo</b> contra el <b>mercado</b>','Línea <b>'+(D.rows[1]||['',''])[1]+'</b> del mercado','El pick: <b>'+D.big+'</b>','Resultado: <b>'+D.sc.a+'–'+D.sc.h+'</b> ✔','<b>'+D.units2+'</b> '+D.sub]}
:{hook:'IN THE 1ST HALF OF '+D.scope,how:'HOW? SEE THE MODEL ▸',how2:'HOW IT WORKS',m0:'Model trained on thousands of games',m1:'Compares',m1v:'Model vs Market',m2:'Only plays with',m2v:'+EDGE',m3:'Specialty',m3v:'1ST HALF',away:'AWAY',home:'HOME',rec:'RECORD',pick:'THE PICK',mod:'MODEL',mkt:'MARKET',hit:'HIT',res1:'RESULT · 1ST HALF',res2:'RESULT · FINAL',recp:'RECORD · ',chart:'CUMULATIVE UNITS',foot:'21+ · Bet responsibly',
  caps:['How the model does in the <b>1st half</b>','It compares the <b>model</b> to the <b>market</b>','Market line <b>'+(D.rows[1]||['',''])[1]+'</b>','The pick: <b>'+D.big+'</b>','Result: <b>'+D.sc.a+'–'+D.sc.h+'</b> ✔','<b>'+D.units2+'</b> '+D.sub]};
// textos

$('m_pill').textContent=T.how2;$('s2a').textContent=T.m0;$('m_l1').textContent=T.m1;$('m_v1').textContent=T.m1v;$('m_l2').textContent=T.m2;$('m_v2').textContent=T.m2v;$('m_l3').textContent=T.m3;$('m_v3').textContent=T.m3v;
$('d_pill').textContent=D.date;
$('tA').style.background=`linear-gradient(160deg,${D.away.c1},${D.away.c2})`;$('tB').style.background=`linear-gradient(200deg,${D.home.c1},${D.home.c2})`;
const nm=(o,lab,col,fs)=>`<div style="font-size:30px;letter-spacing:4px;color:${col};font-weight:800">${lab}</div><div class="big" style="font-size:${fs}px">${o.name}</div><div style="font-size:30px;margin-top:10px;color:${col}">${o.city||''}</div>`+(o.rec?`<div style="font-size:28px;margin-top:26px;color:#9fb0c8;letter-spacing:3px">${T.rec}</div><div class="big" style="font-size:80px">${o.rec}</div>`:'');
$('tAn').innerHTML=nm(D.away,T.away,D.away.ac,D.away.name.length>7?62:86);$('tBn').innerHTML=nm(D.home,T.home,D.home.ac,D.home.name.length>7?62:86);
$('rowsCard').innerHTML=D.rows.map((r,i)=>`<div class="stat" id="row${i}"><span>${r[0]}</span><b style="color:${i==1?'#fdbb30':i==2?'#2ee6a6':'#fff'}">${r[1]}</b></div>`).join('');
$('p_pill').textContent=T.pick;$('s4t').innerHTML=D.pickTitle;$('s4o').textContent=D.big;$('s4b').textContent=D.odds+(D.book?' · '+D.book:'');
$('s4c').innerHTML='<div style="display:flex;justify-content:space-around;text-align:center">'+(D.pm!=null?`<div><div style="font-size:30px;color:#9fb0c8">${T.mod}</div><div class="big" style="font-size:96px;color:#2ee6a6" id="pm">${D.pm}%</div></div>`:'')+(D.pk!=null?`<div><div style="font-size:30px;color:#9fb0c8">${T.mkt}</div><div class="big" style="font-size:96px" id="pk">${D.pk}%</div></div>`:'')+'</div>';
if(D.pm==null&&D.pk==null)$('s4c').style.display='none';
$('r_pill').textContent=D.sc.label==='h1'?T.res1:T.res2;$('r_an').textContent=D.away.name;$('r_hn').textContent=D.home.name;$('r2').innerHTML='✔ '+(D.hit||D.big)+'<br>'+T.hit+'!';$('r3').textContent=D.units;$('r1h').textContent=D.sc.h;
$('g_pill').textContent=T.recp+D.sportLabel+' · '+D.sub.toUpperCase();$('g1').textContent=rec.w+'-'+rec.l;$('g2').textContent=D.units2;$('g_t').textContent=T.chart;$('foot').textContent=T.foot;
if(D.rec.u<0){$('g1').style.color='#ff6b6b';$('s1t').style.color='#ff6b6b'}
// fondo
let seed=7;function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646}
const S=[[0,3.5],[3.5,7],[7,12],[12,17],[17,21],[21,27]];
const bg=$('bg');
const palette=[[D.away.c1,D.away.ac],[D.home.c1,D.home.ac],['#0b1a3a','#2ee6a6']];
let h='<div id="grad" class="layer"></div>';
h+=`<svg id="court" class="layer" viewBox="0 0 1080 1920" style="opacity:.28;transform-origin:50% 50%"><g fill="none" stroke="#fff" stroke-width="5">
<rect x="90" y="140" width="900" height="1640" rx="8"/><line x1="90" y1="960" x2="990" y2="960"/><circle cx="540" cy="960" r="150"/>
<rect x="340" y="140" width="400" height="380"/><circle cx="540" cy="520" r="150"/><path d="M190 140 V330 A360 360 0 0 0 890 330 V140"/>
<rect x="340" y="1400" width="400" height="380"/><circle cx="540" cy="1400" r="150"/><path d="M190 1780 V1590 A360 360 0 0 1 890 1590 V1780"/></g></svg>`;
let blobs=[];for(let i=0;i<7;i++){const p=palette[i%3];blobs.push({x:rnd()*1080,y:rnd()*1920,r:200+rnd()*260,c:p[i%2],ph:rnd()*6.28,sp:.3+rnd()*.5});}
blobs.forEach((b,i)=>h+=`<div id="bl${i}" style="width:${b.r*2}px;height:${b.r*2}px;border-radius:50%;background:radial-gradient(circle,${b.c}55,transparent 70%);position:absolute;left:0;top:0"></div>`);
let balls=[];for(let i=0;i<4;i++)balls.push({x:rnd()*900+60,y:rnd()*1700+100,s:90+rnd()*160,ph:rnd()*6.28,sp:.4+rnd()*.6,rot:rnd()*360});
const ballSVG=s=>`<svg width="${s}" height="${s}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="#e8742a" stroke="#1a0d05" stroke-width="3"/><g fill="none" stroke="#1a0d05" stroke-width="2.5"><path d="M50 3V97M3 50H97"/><path d="M15 15C40 38 40 62 15 85M85 15C60 38 60 62 85 85"/></g></svg>`;
balls.forEach((b,i)=>h+=`<div id="ba${i}" style="position:absolute;left:0;top:0;opacity:.22;filter:blur(${i>1?4:0}px)">${ballSVG(b.s)}</div>`);
h+='<div class="layer" style="background:linear-gradient(180deg,rgba(7,11,20,.55),rgba(7,11,20,.15) 40%,rgba(7,11,20,.7))"></div>';
bg.innerHTML=h;
const accents=[['#0b1a3a','#05080f'],['#0b2a24','#05080f'],[D.away.c1,D.home.c2],['#10301f','#05080f'],['#1a2a52','#05080f'],['#0b2a24','#05080f']];
function fade(i,t){const [a,b]=S[i];const fi=cl((t-a)/.45),fo=cl((b-t)/.45);return Math.min(fi,i==5?1:fo)}
function set(el,p,y=0,sc=1){el.style.opacity=p;el.style.transform=`translateY(${(1-p)*y}px) scale(${sc})`}
// grafico
const P=rec.pts,X0=60,X1=860,YT=60,YB=420;
const vals=P.map(p=>p[1]);const vmin=Math.min(0,...vals),vmax=Math.max(0.5,...vals);
const px=i=>P.length>1?X0+(X1-X0)*i/(P.length-1):(X0+X1)/2,py=v=>YB-(v-vmin)/(vmax-vmin)*(YB-YT);
const pts=P.map((p,i)=>[px(i),py(p[1])]);
const dpath=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
$('line').setAttribute('d',dpath);$('area').setAttribute('d',dpath+` L${pts[pts.length-1][0]} ${py(0)} L${pts[0][0]} ${py(0)} Z`);
let gh=`<line x1="30" x2="880" y1="${py(0)}" y2="${py(0)}" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-dasharray="10 10"/><text x="30" y="${py(0)-10}" fill="#9fb0c8" font-size="26">0u</text>`;
const tp=Math.ceil(vmax);if(tp>0&&py(tp)>YT-30)gh+=`<line x1="30" x2="880" y1="${py(tp)}" y2="${py(tp)}" stroke="#fff" stroke-opacity=".1" stroke-width="2"/><text x="30" y="${py(tp)-8}" fill="#9fb0c8" font-size="26">+${tp}u</text>`;
$('grid').innerHTML=gh;
const last=P.length-1,step=Math.max(1,Math.ceil(P.length/7));
let dh='',lh='';pts.forEach((q,i)=>{dh+=`<circle id="dt${i}" cx="${q[0]}" cy="${q[1]}" r="13" fill="#070b14" stroke="${i==last?'#fdbb30':'#2ee6a6'}" stroke-width="7" opacity="0"/>`;if(i%step===0||i==last)lh+=`<text x="${q[0]}" y="490" text-anchor="middle" fill="#9fb0c8" font-size="26">${P[i][0]}</text>`});
$('dots').innerHTML=dh;$('lbls').innerHTML=lh;
$('dots').insertAdjacentHTML('beforeend',`<text id="endlbl" x="${pts[last][0]-10}" y="${pts[last][1]-30}" text-anchor="end" fill="#fdbb30" font-size="44" font-weight="900" opacity="0">${D.units2}</text>`);
const LEN=$('line').getTotalLength();$('line').style.strokeDasharray=LEN;
// subtitulos
const CAPS=[[T.caps[0],.5],[T.caps[1],.3],[T.caps[2],.6],[T.caps[3],.5],[T.caps[4],.5],[T.caps[5],.8]];
const capEl=$('cap');let lastK=-1;
function caption(t,k){const [txt,d]=CAPS[k];if(lastK!==k){capEl.innerHTML=txt.replace(/<b>/g,'<b style="color:#2ee6a6">');lastK=k}
 const lt=t-S[k][0];capEl.style.opacity=cl((lt-d)/.3)*cl((S[k][1]-t)/.3);capEl.style.transform=`translateY(${(1-cl((lt-d)/.3))*20}px)`}
window.render=function(t){
 const si=S.findIndex(s=>t<s[1]);const k=si<0?5:si;
 $('grad').style.background=`radial-gradient(120% 80% at 50% 20%,${accents[k][0]},${accents[k][1]})`;

 blobs.forEach((b,i)=>{$('bl'+i).style.transform=`translate(${b.x-b.r+Math.sin(t*b.sp+b.ph)*140}px,${b.y-b.r+Math.cos(t*b.sp+b.ph)*160}px)`});
 balls.forEach((b,i)=>{const bounce=Math.abs(Math.sin(t*b.sp*2+b.ph))*180;$('ba'+i).style.transform=`translate(${b.x+Math.sin(t*b.sp+b.ph)*120}px,${b.y-bounce}px) rotate(${b.rot+t*60*(i%2?1:-1)}deg)`});
 for(let i=0;i<6;i++){const s=$('s'+(i+1));const o=fade(i,t);s.style.opacity=o;s.style.display=o>0?'block':'none'}
 const L=i=>t-S[i][0];caption(t,k);
 set($('s1t'),eb(L(0)/.6),0,.6+.4*eb(L(0)/.6));set($('s1u'),eo((L(0)-.6)/.4),40);set($('s1v'),eo((L(0)-1.6)/.4),30);
 set($('s2a'),eo(L(1)/.5),40);set($('s2b'),eo((L(1)-.5)/.4),50);set($('s2c'),eo((L(1)-1.1)/.4),50);set($('s2d'),eo((L(1)-1.7)/.4),50);
 $('tA').style.transform=`translateX(${(1-eo(L(2)/.6))*-600}px)`;$('tB').style.transform=`translateX(${(1-eo(L(2)/.6))*600}px)`;
 set($('tAn'),eo((L(2)-.4)/.5),40);set($('tBn'),eo((L(2)-.5)/.5),40);
 $('vs').style.transform=`scale(${eb((L(2)-.7)/.4)})`;$('vs').style.opacity=cl((L(2)-.7)/.2);
 D.rows.forEach((r,i)=>set($('row'+i),eo((L(2)-1.6-i)/.4),40));

 const cnt=eo((L(3)-1.8)/1.2);if($('pm'))$('pm').textContent=Math.round(50+(D.pm-50)*cnt)+'%';
